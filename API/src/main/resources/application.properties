server.port=8000

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/reports-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs

spring.security.oauth2.resourceserver.jwt.issuer-uri-validation.enabled=false

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.example.reportsapi=DEBUG
logging.level.com.example.reportsapi.config=TRACE
